name: smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run content smoke
        run: bash scripts/smoke.sh
